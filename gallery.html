<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTIST_YOYO — Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f4f1ec; --fg: #1c1a18; --muted: #a09a92; --accent: #c8b89a; --gap: 5px; --nav-h: 52px; --footer-h: 38px; }
    body { font-family: 'DM Sans', sans-serif; background: var(--fg); }
    nav { height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; background: var(--bg); }
    .nav-logo { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic; font-size: 1.2rem; letter-spacing: 0.08em; color: var(--fg); text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 1.5rem; }
    .nav-tag { font-size: 0.55rem; font-weight: 300; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 0.25rem 0.7rem; }
    .nav-count { font-size: 0.55rem; font-weight: 300; letter-spacing: 0.18em; color: var(--muted); }
    #gallery { width: 100%; display: flex; flex-direction: column; gap: var(--gap); background: var(--fg); padding: var(--gap) 0; }
    .photo-row { display: flex; gap: var(--gap); width: 100%; }
    .photo-cell { position: relative; overflow: hidden; cursor: pointer; background: #1a1a1a; flex-shrink: 0; }
    .photo-cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.55s cubic-bezier(0.22,0.1,0.25,1), filter 0.4s; filter: brightness(0.95) saturate(0.9); }
    .photo-cell:hover img { transform: scale(1.04); filter: brightness(1.02) saturate(1.05); }
    .cell-ov { position: absolute; inset: 0; background: rgba(244,241,236,0); transition: background 0.3s; pointer-events: none; }
    .photo-cell:hover .cell-ov { background: rgba(244,241,236,0.07); }
    .footer-strip { height: var(--footer-h); background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; }
    .footer-strip span { font-size: 0.52rem; font-weight: 300; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); }
    .footer-name { font-family: 'Cormorant Garamond', serif !important; font-style: italic; font-size: 1rem !important; letter-spacing: 0.06em !important; color: var(--fg) !important; }
    #loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 300; }
    #loading span { font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
    .loading-bar { width: 120px; height: 1px; background: #ddd; position: relative; overflow: hidden; }
    .loading-bar::after { content: ''; position: absolute; left: -100%; top: 0; width: 100%; height: 100%; background: var(--accent); animation: slide 1s infinite; }
    @keyframes slide { to { left: 100%; } }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(244,241,236,0.96); z-index: 200; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    #lbImg { max-width: 88vw; max-height: 88vh; object-fit: contain; display: block; }
    .lb-close { position: fixed; top: 1.2rem; right: 1.8rem; background: none; border: none; font-size: 0.6rem; color: var(--muted); cursor: pointer; transition: color 0.2s; letter-spacing: 0.22em; text-transform: uppercase; }
    .lb-close:hover { color: var(--fg); }
    .lb-nav { position: fixed; top: 50%; transform: translateY(-50%); background: none; border: none; color: #ccc; font-size: 2.5rem; cursor: pointer; padding: 1rem; transition: color 0.2s; line-height: 1; }
    .lb-nav:hover { color: var(--fg); }
    .lb-prev { left: 0; } .lb-next { right: 0; }
    .lb-info { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); font-size: 0.52rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); }
  </style>
</head>
<body>
<div id="loading"><div class="loading-bar"></div><span>Loading photos</span></div>
<nav>
  <a href="photography-portfolio.html" class="nav-logo">ARTIST_YOYO</a>
  <div class="nav-right">
    <span class="nav-tag">Portrait</span>
    <span class="nav-count" id="photoCount"></span>
  </div>
</nav>
<div id="gallery"></div>
<div class="footer-strip">
  <span>© 2025</span><span class="footer-name">ARTIST_YOYO</span><span>Portrait Series</span>
</div>
<div class="lightbox" id="lightbox" onclick="closeLb(event)">
  <button class="lb-close" onclick="closeLbBtn()">close</button>
  <button class="lb-nav lb-prev" onclick="navLb(-1)">‹</button>
  <img id="lbImg" src="" alt="" />
  <button class="lb-nav lb-next" onclick="navLb(1)">›</button>
  <div class="lb-info" id="lbInfo"></div>
</div>

<script>
// 大寫JPG：DSC00997 DSC01025 DSC01048 DSC01078 DSC01167 DSC01262 DSC01318 DSC01670 DSC01779 DSC043099
// 小寫jpg：其餘所有

const ROWS = [
  // 列1: H D D H D D
  [
    'photos/DSC00997.JPG',    // H 大寫
    'photos/DSC01025.JPG',    // D 大寫
    'photos/DSC01048.JPG',    // D 大寫
    'photos/DSC03920.jpg',    // H 小寫
    'photos/DSC01078.JPG',    // D 大寫
    'photos/DSC01167.JPG',    // D 大寫
  ],
  // 列2: D H D D H D
  [
    'photos/DSC01262.JPG',    // D 大寫
    'photos/DSC03408.jpg',    // H 小寫
    'photos/DSC01318.JPG',    // D 大寫
    'photos/DSC01670.JPG',    // D 大寫
    'photos/DSC03976.jpg',    // H 小寫
    'photos/DSC01779.JPG',    // D 大寫
  ],
  // 列3: D D H D D
  [
    'photos/DSC03919.jpg',    // D 小寫
    'photos/DSC05008.jpg',    // D 小寫
    'photos/DSC04245.jpg',    // H 小寫
    'photos/DSC05108.jpg',    // D 小寫
    'photos/DSC05273.jpg',    // D 小寫
  ],
  // 列4: H D D H D D
  [
    'photos/DSC04290.jpg',    // H 小寫
    'photos/DSC05377.jpg',    // D 小寫
    'photos/DSC05850.jpg',    // D 小寫
    'photos/DSC04519.jpg',    // H 小寫
    'photos/DSC05969.jpg',    // D 小寫
    'photos/DSC06102.jpg',    // D 小寫
  ],
  // 列5: D H D D H D
  [
    'photos/DSC043031.jpg',   // D 小寫
    'photos/DSC04663.jpg',    // H 小寫
    'photos/DSC043036.jpg',   // D 小寫
    'photos/DSC043038.jpg',   // D 小寫
    'photos/DSC06112.jpg',    // H 小寫
    'photos/DSC043099.JPG',   // D 大寫
  ],
];

const allPhotos = ROWS.flat();
document.getElementById('photoCount').textContent = `${allPhotos.length} photographs`;

function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => resolve({ src, ratio: img.naturalWidth / img.naturalHeight });
    img.onerror = () => resolve({ src, ratio: 1.5 });
    img.src = src;
  });
}

Promise.all(allPhotos.map(loadImage)).then(photos => {
  document.getElementById('loading').style.display = 'none';
  const GAP    = 5;
  const availW = document.documentElement.clientWidth;
  const gallery = document.getElementById('gallery');
  let offset = 0;

  ROWS.forEach(rowSrcs => {
    const count     = rowSrcs.length;
    const rowPhotos = photos.slice(offset, offset + count);
    offset += count;

    const ratioSum = rowPhotos.reduce((s, p) => s + p.ratio, 0);
    const usableW  = availW - (count - 1) * GAP;
    const rowH     = usableW / ratioSum;

    const rowEl = document.createElement('div');
    rowEl.className = 'photo-row';
    rowEl.style.height = rowH + 'px';

    rowPhotos.forEach((p, j) => {
      const isLast = j === count - 1;
      const cell   = document.createElement('div');
      cell.className    = 'photo-cell';
      cell.style.height = rowH + 'px';
      if (isLast) {
        cell.style.flex = '1';
      } else {
        cell.style.width = (rowH * p.ratio) + 'px';
      }
      const img = document.createElement('img');
      img.src = p.src; img.alt = '';
      const ov = document.createElement('div');
      ov.className = 'cell-ov';
      cell.appendChild(img);
      cell.appendChild(ov);
      const gi = offset - count + j;
      cell.addEventListener('click', () => openLb(gi, photos));
      rowEl.appendChild(cell);
    });
    gallery.appendChild(rowEl);
  });
});

let _ph = [], cur = 0;
function openLb(i, ph) {
  _ph = ph; cur = i;
  document.getElementById('lbImg').src = _ph[i].src;
  document.getElementById('lbInfo').textContent = `${i+1}  /  ${_ph.length}`;
  document.getElementById('lightbox').classList.add('open');
}
function closeLbBtn() { document.getElementById('lightbox').classList.remove('open'); }
function closeLb(e)   { if (e.target === document.getElementById('lightbox')) closeLbBtn(); }
function navLb(d) {
  cur = (cur + d + _ph.length) % _ph.length;
  document.getElementById('lbImg').src = _ph[cur].src;
  document.getElementById('lbInfo').textContent = `${cur+1}  /  ${_ph.length}`;
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
  if (e.key === 'Escape')     closeLbBtn();
});
</script>
</body>
</html>
